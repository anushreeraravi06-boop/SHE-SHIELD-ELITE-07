<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SafeHer — Women Safety</title>

<style>
:root{
  --bg:#f5efe6;
  --card:#fffaf3;
  --accent:#e07a5f;
  --accent2:#f4a261;
  --muted:#6b5e52;
  --text:#3a2c2c;
}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh
}
.wrap{max-width:920px;margin:18px auto;padding:12px}
header{text-align:center}
h1{margin:0;color:var(--accent)}
p.lead{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  background:var(--card);
  padding:14px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.08)
}
.full{grid-column:1/-1}
button{
  cursor:pointer;
  border:0;
  padding:12px;
  border-radius:10px;
  font-weight:600
}
.danger{
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  color:#fff
}
.muted{
  background:transparent;
  border:1px solid #e6cfc9;
  color:var(--muted)
}
.row{display:flex;gap:10px}
input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #e6cfc9
}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
#log{font-size:13px;color:var(--muted);background:#fff;padding:8px;border-radius:8px}
.small{font-size:13px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px}

#startScreen{
  position:fixed;inset:0;
  background:#000000b0;
  display:flex;align-items:center;justify-content:center;
  z-index:9999
}
#startBox{
  background:#fffaf3;
  padding:22px;
  border-radius:14px;
  text-align:center;
  max-width:360px
}
</style>
</head>

<body>

<!-- ENABLE SCREEN -->
<div id="startScreen">
  <div id="startBox">
    <h2>SafeHer</h2>
    <p class="small">Tap once to enable siren, voice and sensors</p>
    <button class="danger" id="enableBtn">Enable System</button>
  </div>
</div>

<div class="wrap" id="app" aria-hidden="true">
<header>
  <h1>SafeHer</h1>
  <p class="lead">Women Safety Web App</p>
</header>

<main class="grid">

<!-- SOS -->
<section class="card">
  <label>Emergency</label>
  <button id="criticalBtn" class="danger">🚨 Emergency SOS (Long Press)</button>
  <div style="height:10px"></div>
  <button id="discreetBtn" class="muted">Discreet SOS</button>
  <div style="height:10px"></div>
  <div id="log">Ready.</div>
</section>

<!-- SIREN -->
<section class="card">
  <label>Siren Control</label>
  <div class="row">
    <button id="startSiren" class="danger">Start Siren</button>
    <button id="stopSiren" class="muted">Stop</button>
  </div>
</section>

<!-- HELPLINE (ADDED) -->
<section class="card">
  <label>Emergency Helpline</label>
  <a href="tel:112"><button class="danger" style="width:100%">🚔 Police 112</button></a>
  <div style="height:6px"></div>
  <a href="tel:181"><button class="muted" style="width:100%">👩 Women Helpline 181</button></a>
  <div style="height:6px"></div>
  <a href="tel:108"><button class="muted" style="width:100%">🚑 Ambulance 108</button></a>
</section>

<!-- LOCATION -->
<section class="card">
  <label>Location</label>
  <button id="getLoc" class="muted">Get Location</button>
  <div style="height:6px"></div>
  <button id="shareLoc" class="muted">Share Location</button>
</section>

<!-- EXTRA FEATURES -->
<section class="card full">
  <label>Helpful Tools</label>
  <button class="muted" onclick="navigator.clipboard.writeText('I am in danger. Please contact me immediately.')">
    📋 Copy Emergency Message
  </button>
  <div style="height:6px"></div>
  <a href="tel:+911234567890">
    <button class="muted">📞 Call Trusted Contact</button>
  </a>
</section>

</main>

<footer>
  SafeHer • Single File • GitHub Pages Ready
</footer>
</div>

<script>
/* SAME LOGIC AS YOUR ORIGINAL CODE */

const byId = id => document.getElementById(id);
const logEl = t => byId('log').innerText = t;

let audioCtx, osc, gainNode;

/* ENABLE */
byId('enableBtn').onclick = async ()=>{
  byId('startScreen').style.display='none';
  byId('app').ariaHidden=false;
  audioCtx = new (window.AudioContext||webkitAudioContext)();
  await audioCtx.resume();
  logEl("System enabled");
};

/* SIREN */
function startSiren(){
  osc = audioCtx.createOscillator();
  gainNode = audioCtx.createGain();
  osc.type="sawtooth";
  osc.frequency.value=700;
  gainNode.gain.value=1;
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc.start();
}
function stopSiren(){ osc?.stop(); }

byId('startSiren').onclick=startSiren;
byId('stopSiren').onclick=stopSiren;

/* LOCATION */
byId('getLoc').onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    logEl(`Lat: ${p.coords.latitude}, Lon: ${p.coords.longitude}`);
  });
};
byId('shareLoc').onclick=()=>{
  navigator.geolocation.getCurrentPosition(p=>{
    const msg=`Help! https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
    window.open("https://wa.me/?text="+encodeURIComponent(msg));
  });
};

/* SOS */
byId('criticalBtn').onclick=()=>{ startSiren(); byId('shareLoc').click(); };
byId('discreetBtn').onclick=()=>byId('shareLoc').click();
</script>

</body>
</html>
